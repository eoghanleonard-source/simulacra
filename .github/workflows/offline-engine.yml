name: Offline engine source

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test dependency only
        run: python -m pip install pytest==8.1.1
      - name: Check synthetic lifecycle, packaging and export without network
        run: python scripts/engine/offline_ci.py
      - name: Record commit, source archive and retained evaluation binding
        run: cat dist/offline-ci/attestation.json
